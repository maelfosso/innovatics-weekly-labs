[project]
name = "innovatics"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mael FOSSO", email = "fosso.mael.elvis@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "duckdb>=1.5.6",
    "langchain-community>=0.4.2",
    "langchain-text-splitters>=1.1.3",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pandas>=3.0.6",
    "plotly>=7.1.0",
    "polars>=2.0.0",
    "pyarrow>=26.0.0",
    "rank-bm25>=0.2.2",
    "scipy>=1.18.1",
    "seaborn>=0.13.2",
]

[project.scripts]
innovatics = "innovatics:main"

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]
dl = [
    "keras>=3.15.1",
    "tensorflow>=2.21.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
]
ml = [
    "lightgbm>=4.7.0",
    "scikit-learn>=1.9.1",
    "statsmodels>=0.15.0",
    "xgboost>=3.4.1",
]
nlp = [
    "datasets>=5.1.0",
    "langchain>=1.4.6",
    "langchain-core>=1.6.11",
    "langchain-text-splitters>=1.1.3",
    "sentence-transformers>=6.1.0",
    "transformers>=5.20.0",
]

[tool.uv]
default-groups = "all"
